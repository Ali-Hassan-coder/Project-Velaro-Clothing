<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-gold.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velaro Clothing | Bespoke Leather Jackets, Streetwear & Racing Suits</title>
    <meta name="description" content="Velaro Clothing: Handcrafted bespoke Italian leather jackets, heavy 500 GSM loopback cotton streetwear hoodies, and CE AAA-grade motorbike racing suits. Worldwide shipping." />
    <meta name="keywords" content="Velaro Clothing, Velaro, Velaro Clothing Official, bespoke leather jackets, custom leather jacket, motorcycle racing suits, luxury streetwear, dark luxury clothing, Velaro apparel" />
    <meta name="author" content="Velaro Clothing" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://velaro-clothing.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Velaro Clothing" />
    <meta property="og:url" content="https://velaro-clothing.com/" />
    <meta property="og:title" content="Velaro Clothing | Official Atelier & Store" />
    <meta property="og:description" content="Handcrafted bespoke Italian leather jackets, heavy 500 GSM loopback cotton streetwear hoodies, and CE AAA-grade motorbike racing suits." />
    <meta property="og:image" content="https://velaro-clothing.com/logo-gold.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@velaroclothing.co" />
    <meta name="twitter:creator" content="@velaroclothing.co" />
    <meta name="twitter:title" content="Velaro Clothing | Official Atelier & Store" />
    <meta name="twitter:description" content="Handcrafted bespoke Italian leather jackets, heavy 500 GSM loopback cotton streetwear hoodies, and CE AAA-grade motorbike racing suits." />
    <meta name="twitter:image" content="https://velaro-clothing.com/logo-gold.png" />

    <!-- Structured Data (JSON-LD) for Google Brand Knowledge Graph -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://velaro-clothing.com/#organization",
          "name": "Velaro Clothing",
          "alternateName": ["Velaro", "Velaro Clothing Co", "Velaro Atelier"],
          "url": "https://velaro-clothing.com/",
          "logo": "https://velaro-clothing.com/logo-gold.png",
          "sameAs": [
            "https://www.instagram.com/velaroclothing.co"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "url": "https://velaro-clothing.com/contact"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://velaro-clothing.com/#website",
          "url": "https://velaro-clothing.com/",
          "name": "Velaro Clothing",
          "publisher": {
            "@id": "https://velaro-clothing.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://velaro-clothing.com/shop?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Google Fonts: Syne (Headlines) + Plus Jakarta Sans (Body & Details) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Syne:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
